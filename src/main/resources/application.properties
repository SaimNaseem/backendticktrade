spring.application.name=TickTrade

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:jfs}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true

# Error messages
spring.web.error.include-message=always

# Port
server.port=${PORT:8083}

# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Public API base used in product image URLs (leave empty for relative paths)
app.public-base-url=${APP_PUBLIC_BASE_URL:}

# Amazon S3
aws.s3.bucket=${AWS_S3_BUCKET:ticktrade-product-images}
aws.s3.region=${AWS_REGION:eu-central-1}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}